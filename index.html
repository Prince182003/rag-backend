<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Platform - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
        <div class="text-center mb-6">
            <h2 class="text-3xl font-extrabold text-indigo-600">RAG Platform</h2>
            <p id="subtitle" class="text-sm text-slate-500 mt-1">Create your account with Email OTP verification</p>
        </div>

        <!-- Email Step -->
        <div id="email-section">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com" 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900">
            </div>
            <button onclick="sendOTP()" id="send-btn" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                Send Verification Code
            </button>
        </div>

        <!-- OTP Step -->
        <div id="otp-section" class="hidden">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-slate-700 mb-1">Enter 6-Digit OTP</label>
                <input type="text" id="otp-input" maxlength="6" placeholder="123456" 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-lg text-center tracking-widest text-2xl font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900">
            </div>
            <button onclick="verifyOTP()" 
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                Verify & Register
            </button>
        </div>

        <p id="status-message" class="text-center text-sm mt-4 font-medium text-slate-600"></p>
    </div>

    <script>
        const API_URL = "https://rag-backend-0rhg.onrender.com";
        let userEmail = "";

        async function sendOTP() {
            userEmail = document.getElementById('email').value.trim();
            const statusMsg = document.getElementById('status-message');
            const sendBtn = document.getElementById('send-btn');

            if (!userEmail) {
                statusMsg.style.color = "#dc2626";
                statusMsg.innerText = "Please enter a valid email address.";
                return;
            }

            sendBtn.innerText = "Sending...";
            sendBtn.disabled = true;
            statusMsg.innerText = "Sending OTP to your email...";
            statusMsg.style.color = "#d97706";

            try {
                const response = await fetch(`${API_URL}/api/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail })
                });

                const data = await response.json();

                if (response.ok) {
                    statusMsg.style.color = "#16a34a";
                    statusMsg.innerText = "OTP sent successfully! Check your inbox.";
                    document.getElementById('email-section').classList.add('hidden');
                    document.getElementById('otp-section').classList.remove('hidden');
                    document.getElementById('subtitle').innerText = "Enter the code sent to " + userEmail;
                } else {
                    throw new Error(data.error || 'Failed to send OTP.');
                }
            } catch (error) {
                statusMsg.style.color = "#dc2626";
                statusMsg.innerText = "Error: " + error.message;
                sendBtn.innerText = "Send Verification Code";
                sendBtn.disabled = false;
            }
        }

        function verifyOTP() {
            const enteredOtp = document.getElementById('otp-input').value.trim();
            const statusMsg = document.getElementById('status-message');

            if (enteredOtp.length !== 6) {
                statusMsg.style.color = "#dc2626";
                statusMsg.innerText = "Please enter the complete 6-digit code.";
                return;
            }

            // Save user email in browser session storage and move to home page
            sessionStorage.setItem('rag_user', userEmail);
            window.location.href = "home.html";
        }
    </script>
</body>
</html>
