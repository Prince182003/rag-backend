<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Platform - Upload Documents</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-indigo-600">RAG Platform</h1>
        <div class="space-x-4">
            <a href="home.html" class="text-slate-600 hover:text-indigo-600 font-medium">Home</a>
            <a href="upload.html" class="text-indigo-600 font-semibold">Upload Documents</a>
            <a href="profile.html" class="text-slate-600 hover:text-indigo-600 font-medium">Profile</a>
            <button onclick="logout()" class="text-red-600 hover:text-red-700 font-medium ml-4">Logout</button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto mt-10 p-6">
        <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Upload Files for RAG</h2>
            <p class="text-slate-600 mb-6 text-sm">Upload PDFs, TXT, or CSV files to index them into your knowledge base.</p>
            
            <div class="border-2 border-dashed border-slate-300 rounded-xl p-8 text-center bg-slate-50 hover:bg-slate-100 transition cursor-pointer">
                <input type="file" id="file-input" class="hidden" multiple onchange="handleFileSelect(event)">
                <label for="file-input" class="cursor-pointer">
                    <span class="text-4xl">📂</span>
                    <p class="text-sm font-semibold text-slate-700 mt-2">Click to browse or drag files here</p>
                    <p class="text-xs text-slate-500 mt-1">Support for PDF, TXT up to 10MB</p>
                </label>
            </div>

            <div id="file-list" class="mt-4 space-y-2"></div>

            <button onclick="uploadFiles()" 
                class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                Process & Index Files
            </button>
            <p id="upload-status" class="text-center text-sm mt-3 font-medium text-slate-600"></p>
        </div>
    </main>

    <script>
        const email = sessionStorage.getItem('rag_user');
        if (!email) window.location.href = "index.html";

        function handleFileSelect(event) {
            const list = document.getElementById('file-list');
            list.innerHTML = "";
            for (let file of event.target.files) {
                list.innerHTML += `<div class="p-2 bg-slate-100 rounded text-sm text-slate-700 flex justify-between"><span>${file.name}</span><span>${(file.size/1024).toFixed(1)} KB</span></div>`;
            }
        }

        function uploadFiles() {
            const status = document.getElementById('upload-status');
            status.style.color = "#16a34a";
            status.innerText = "Files processed and indexed successfully!";
        }

        function logout() {
            sessionStorage.removeItem('rag_user');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
